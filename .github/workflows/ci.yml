# Builds, tests and exports for every push, with GCC, MSVC and Clang. GCC and MSVC make the one build for each OS.
# Clang validates only, and its build is never shipped. No secrets are used. A prerelease can only come from main,
# and only when release.yml's gates pass: see docs/release.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rehearse:
        description: Also package and smoke-test a rehearsal build, which can never be published
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linux
            os: ubuntu-22.04
            ships: true
          - name: windows
            platform: windows
            os: windows-2022
            ships: true
          - name: linux-clang
            platform: linux
            os: ubuntu-24.04
            ships: false
            clang-package: "1:18.1.3-1ubuntu1"
            clang-version: "18.1.3"
            scons-args: use_llvm=yes
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the pinned Clang
        if: ${{ matrix.clang-package }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades "clang-18=${{ matrix.clang-package }}"
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          clang++ --version
          clang++ --version | grep -q "clang version ${{ matrix.clang-version }}"

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          windows-compiler: msvc
          scons-version: 4.9.1

      - name: Restore SCons cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: dagon-${{ matrix.name }}

      - name: Build extension (debug)
        run: |
          mkdir -p build/logs
          scons platform=${{ matrix.platform }} target=template_debug show_flags=yes require_msvc=yes ${{ matrix.scons-args }} 2>&1 | tee build/logs/build-debug.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build extension (release)
        run: |
          scons platform=${{ matrix.platform }} target=template_release show_flags=yes require_msvc=yes ${{ matrix.scons-args }} 2>&1 | tee build/logs/build-release.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Save SCons cache
        if: always()
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: dagon-${{ matrix.name }}

      - name: Unit tests
        run: |
          scons unit_tests ${{ matrix.scons-args }} 2>&1 | tee build/logs/unit-tests.log
          test "${PIPESTATUS[0]}" -eq 0

      # Only the project's own files: warnings from godot-cpp and other third-party code are not ours to fail on.
      - name: Check the project's code built without warnings
        run: |
          if grep -hE '^(src|tests)[/\\].*warning' build/logs/build-debug.log build/logs/build-release.log build/logs/unit-tests.log; then
            echo "::error::The project's own code built with warnings on ${{ matrix.name }}"
            exit 1
          fi

      - name: Restore Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.dagon-tools
            ~/.local/share/godot/export_templates/4.7.2.stable
            ~/AppData/Roaming/Godot/export_templates/4.7.2.stable
          key: godot-4.7.2-${{ runner.os }}-${{ hashFiles('tools/install_godot.sh', 'tools/install_export_templates.sh', 'tools/extract_templates.py') }}

      - name: Install Godot (SHA-512 verified)
        run: echo "GODOT=$(sh tools/install_godot.sh "$HOME/.dagon-tools")" >> "$GITHUB_ENV"

      - name: Install export templates (SHA-512 verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: sh tools/install_export_templates.sh

      - name: Godot checks (import, extension load, integration, smoke)
        run: sh tools/run_godot_checks.sh build/logs/godot

      - name: Export and run release build
        run: sh tools/export_check.sh ${{ matrix.platform }} build/logs/export

      # Every other check redirects storage. This one uses the real user folder of this throwaway runner.
      - name: Check the player's storage path
        if: ${{ matrix.ships }}
        run: |
          "$GODOT" --headless --path project --script res://tests/user_dir_probe.gd 2>&1 | tee build/logs/user-dir-probe.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "^USER_DIR_PROBE ok" build/logs/user-dir-probe.log

      - name: Check Shore art (one palette, feet do not slide, ground on the collision)
        if: ${{ matrix.ships }}
        run: |
          python -m pip install pillow==13.0.0
          python tools/art/check_art.py 2>&1 | tee build/logs/check-art.log
          test "${PIPESTATUS[0]}" -eq 0

      # Annotations are readable through the public API without a token, which
      # lets reports quote this evidence. Job logs are not. These steps only
      # report: a missing log prints "missing" and never changes the job result,
      # which is decided by the steps above. GitHub keeps 10 notices per step.
      - name: Publish build evidence as annotations
        if: always()
        run: sh tools/ci_annotate.sh build ${{ matrix.platform }} ${{ matrix.name }}

      - name: Publish test evidence as annotations
        if: always()
        run: sh tools/ci_annotate.sh tests ${{ matrix.platform }} ${{ matrix.name }}

      - name: Publish entry scene evidence as annotations
        if: always()
        run: sh tools/ci_annotate.sh entry ${{ matrix.platform }} ${{ matrix.name }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: build/logs/

      - name: Upload export
        if: ${{ matrix.ships }}
        uses: actions/upload-artifact@v7
        with:
          name: dagon-${{ matrix.platform }}
          path: build/export/${{ matrix.platform }}/

  release-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the release tools
        run: python tools/test_release_tools.py
      - name: Check the release records
        run: python tools/release_gate.py validate

  release:
    needs: [desktop, release-tools]
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.rehearse == true) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ci-result: ${{ needs.desktop.result == 'success' && needs.release-tools.result == 'success' && 'success' || 'failure' }}
      rehearse: ${{ inputs.rehearse == true }}
