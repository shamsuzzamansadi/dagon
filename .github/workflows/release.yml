# Decides, packages and publishes a milestone prerelease from the commit CI has just tested. Called only by ci.yml,
# after its checks, so the packages are the very files that run built and tested. A record can instead ship an earlier
# commit on main, from main's own push run of it (D128): that commit is checked out to package it, that run's exports
# are packaged, and the tag goes on that commit. See docs/release.md.
name: Release

on:
  workflow_call:
    inputs:
      ci-result:
        type: string
        required: true
      rehearse:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      record: ${{ steps.gate.outputs.record }}
      publish: ${{ steps.gate.outputs.publish }}
      target: ${{ steps.gate.outputs.target }}
      source-run: ${{ steps.gate.outputs.source_run }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      # The whole history, so that an earlier commit a record ships can be checked: on main, and with the files accepted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Evaluate the release gates
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ inputs.ci-result }}
          REHEARSE: ${{ inputs.rehearse && '--rehearse' || '' }}
        run: python tools/release_gate.py evaluate --ci-result "$CI_RESULT" $REHEARSE

  package:
    needs: gate
    if: ${{ needs.gate.outputs.version != '' }}
    name: package-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    # One package for each OS the record ships, made and smoke-tested on that OS: macOS on Apple Silicon (D129).
    strategy:
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # The commit shipped: its own packaging tool, license and credits, as its own release would have used.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.target || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the exact export this run tested
        if: ${{ needs.gate.outputs.source-run == '' }}
        uses: actions/download-artifact@v8
        with:
          name: dagon-${{ matrix.platform }}
          path: export
      - name: Fetch the exact export main's own run of the shipped commit tested
        if: ${{ needs.gate.outputs.source-run != '' }}
        uses: actions/download-artifact@v8
        with:
          name: dagon-${{ matrix.platform }}
          path: export
          run-id: ${{ needs.gate.outputs.source-run }}
          github-token: ${{ github.token }}
      - name: Package
        run: python tools/package_release.py package --platform ${{ matrix.platform }} --version "$VERSION" --export-dir export --out packages
      - name: Smoke-test the package itself
        env:
          # An earlier commit's own packaging tool may predate the record of what it ran on.
          FACTS: ${{ needs.gate.outputs.source-run == '' && format('--facts smoke/smoke-{0}.txt', matrix.platform) || '' }}
        run: python tools/package_release.py smoke --platform ${{ matrix.platform }} --package packages/dagon-* $FACTS
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.platform }}
          path: packages/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: release-smoke-${{ matrix.platform }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14

  prepare:
    needs: [gate, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: packages
          merge-multiple: true
      - name: Fetch the build logs of this run
        if: ${{ needs.gate.outputs.source-run == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          path: logs
      - name: Fetch the build logs of main's own run of the shipped commit
        if: ${{ needs.gate.outputs.source-run != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          path: logs
          run-id: ${{ needs.gate.outputs.source-run }}
          github-token: ${{ github.token }}
      # An earlier commit's own packaging tool writes no such record, so finding none is not a failure here. The
      # preparation itself refuses a Mac release without its record.
      - name: Fetch where each package was smoke-tested
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: release-smoke-*
          path: smoke
          merge-multiple: true
      - name: Prepare the notes, checksums and provenance
        env:
          RECORD: ${{ needs.gate.outputs.record }}
          THIS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RUN: ${{ needs.gate.outputs.source-run }}
          COMMIT: ${{ needs.gate.outputs.target || github.sha }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then
            python tools/release_gate.py prepare --record "$RECORD" --packages packages --logs logs --out prepared --commit "$COMMIT" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/$SOURCE_RUN" --packaged-by "$THIS_RUN at ${{ github.sha }}" --smoke smoke
          else
            python tools/release_gate.py prepare --record "$RECORD" --packages packages --logs logs --out prepared --commit "$COMMIT" --run-url "$THIS_RUN" --smoke smoke
          fi
      # The publish job cannot run in a rehearsal, so this runs its first check, with this job's read-only token.
      - name: Rehearse the publisher's first check
        if: ${{ inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python tools/release_gate.py preflight --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ needs.gate.outputs.version }}
          path: prepared/
          retention-days: 14

  publish:
    needs: [gate, prepare]
    if: ${{ needs.gate.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    # The only job that can write. One publication runs at a time, and a queued one is never cancelled by a running one.
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ needs.gate.outputs.version }}
          path: prepared
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          COMMIT: ${{ needs.gate.outputs.target || github.sha }}
        run: sh tools/publish_release.sh "$VERSION" "$COMMIT" prepared
